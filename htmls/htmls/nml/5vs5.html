<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tactical Operations Center</title>
    <style>
        :root { 
            --accent: #00ff41; 
            --army: #4b5320; 
            --bright: #a3b18a;
        }

        body { 
            font-family: 'Courier New', monospace; 
            background-color: #ffffff;
            background-image: url('DEIN_HINTERGRUND.gif'); 
            background-size: cover; 
            background-attachment: fixed; 
            color: var(--accent); 
            margin: 0; 
            padding-top: 80px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        /* SCANLINES & ABDUNKLUNG */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); /* Dunkelt das Hintergrund-GIF ab */
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 4px;
            z-index: 1; /* Hinter dem Content */
            pointer-events: none; /* WICHTIG: Klicks gehen durch das Overlay durch! */
        }

        /* NAVIGATION */
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(10, 15, 10, 0.95); border-bottom: 1px solid var(--army);
            z-index: 9999; display: flex; justify-content: center; gap: 10px; padding: 12px 0;
        }
        .top-nav a {
            color: var(--accent); text-decoration: none; font-size: 0.75em;
            font-weight: bold; padding: 6px 12px; text-transform: uppercase; border: 1px solid transparent;
        }
        .top-nav a:hover { border: 1px solid var(--accent); background: rgba(0,255,65,0.1); }

        /* CONTENT STYLING */
        h1, .card { position: relative; z-index: 10; } /* Über dem Overlay */

        .card { 
            background: rgba(15, 20, 10, 0.95); padding: 25px; 
            border: 2px solid var(--army); width: 95%; max-width: 1400px;
            box-shadow: 0 0 20px #000; margin-bottom: 40px;
        }

        .setup-controls { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin: 20px 0; }
        .team-input-box { border: 1px dashed var(--army); padding: 15px; background: rgba(0,0,0,0.5); }
        
        input { background: #000; border: 1px solid var(--army); color: var(--accent); padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; }
        button { background: var(--army); color: white; border: 1px solid var(--accent); padding: 10px 20px; cursor: pointer; text-transform: uppercase; font-family: inherit; }

        /* BRACKET DESIGN */
        .bracket-wrapper { display: flex; gap: 40px; padding: 20px; overflow-x: auto; align-items: stretch; }
        .round { display: flex; flex-direction: column; justify-content: space-around; min-width: 260px; }
        .label { background: var(--army); color: white; padding: 5px; text-align: center; margin-bottom: 10px; font-size: 0.8em; }

        .match { background: rgba(0,0,0,0.8); border: 1px solid var(--army); padding: 12px; margin: 15px 0; }
        .team-slot { padding: 5px 0; border-bottom: 1px solid rgba(75,83,32,0.3); }
        .team-slot:last-of-type { border-bottom: none; }
        
        .display-team-name { font-weight: bold; display: block; color: #fff; text-transform: uppercase; }
        .display-players { font-size: 0.7em; opacity: 0.8; }
        .score-input { width: 50px !important; float: right; background: var(--accent) !important; color: #000 !important; font-weight: bold; text-align: center; border: none; margin-top: -25px; }

        .hidden { display: none; }
        #champ-box { border: 2px solid var(--accent); padding: 20px; text-align: center; background: rgba(0,255,65,0.05); }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <nav class="top-nav">
        <a href="../../index.html">[ HUB ]</a>
        <a href="1vs1.html">[ 1VS1 ]</a>
        <a href="2vs2.html">[ 2VS2 ]</a>
        <a href="3vs3.html">[ 3VS3 ]</a>
        <a href="5vs5.html">[ 5VS5 ]</a>
    </nav>

    <h1>[ TACTICAL OPERATIONS ]</h1>

    <div id="step1" class="card">
        <div class="setup-controls">
            <select id="teamCount" onchange="initSetup()" style="padding:10px;">
                <option value="2">2 SQUADS</option>
                <option value="4">4 SQUADS</option>
                <option value="8" selected>8 SQUADS</option>
                <option value="16">16 SQUADS</option>
            </select>
            <select id="boMode" style="padding:10px;">
                <option value="1">Bo1</option>
                <option value="3" selected>Bo3</option>
                <option value="5">Bo5</option>
            </select>
        </div>
        <div id="input-area" class="setup-grid"></div>
        <center><button onclick="startMission()">Mission Starten</button></center>
    </div>

    <div id="tournament-screen" class="card hidden">
        <div id="bracket" class="bracket-wrapper"></div>
        <center><button onclick="location.reload()" style="background:#333; margin-top:20px;">Abbruch</button></center>
    </div>

    <script>
        let reqWins = 2;
        // HIER ANPASSEN: 2 für 2vs2, 3 für 3vs3, 5 für 5vs5
        const pPerTeam = 5; 

        function initSetup() {
            const count = document.getElementById('teamCount').value;
            const area = document.getElementById('input-area');
            area.innerHTML = '';
            for(let i=1; i<=count; i++) {
                let pFields = '';
                for(let p=1; p<=pPerTeam; p++) {
                    pFields += `<input type="text" id="t${i}_p${p}" value="Operator ${p}">`;
                }
                area.innerHTML += `<div class="team-input-box"><strong>SQUAD ${i}</strong><input type="text" id="t${i}_n" value="Team ${i}">${pFields}</div>`;
            }
        }

        function startMission() {
            const count = parseInt(document.getElementById('teamCount').value);
            const bo = parseInt(document.getElementById('boMode').value);
            reqWins = Math.ceil((bo + 1) / 2);
            if(bo === 1) reqWins = 1;

            const teams = [];
            for(let i=1; i<=count; i++) {
                const pList = [];
                for(let p=1; p<=5; p++) {
                    const el = document.getElementById(`t${i}_p${p}`);
                    if(el) pList.push(el.value);
                }
                teams.push({ name: document.getElementById(`t${i}_n`).value, players: pList.join(' | ') });
            }
            buildBracket(count, teams);
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('tournament-screen').classList.remove('hidden');
        }

        function buildBracket(count, teams) {
            const bracket = document.getElementById('bracket');
            bracket.innerHTML = '';
            let rounds = ["Finale"];
            if(count > 2) rounds.unshift("Halbfinale");
            if(count > 4) rounds.unshift("Viertelfinale");
            if(count > 8) rounds.unshift("Achtelfinale");

            rounds.forEach((rName, rIdx) => {
                const roundDiv = document.createElement('div');
                roundDiv.className = 'round';
                roundDiv.innerHTML = `<div class="label">${rName}</div>`;
                const mCount = Math.pow(2, rounds.length - rIdx - 1);
                
                for(let m=0; m<mCount; m++) {
                    const mId = `r${rIdx}_m${m}`;
                    const nId = (rIdx === rounds.length - 1) ? 'champ' : `r${rIdx+1}_m${Math.floor(m/2)}_t${m%2}`;
                    const t0 = (rIdx === 0) ? teams[m*2] : {name:'IN MISSION...', players:'---'};
                    const t1 = (rIdx === 0) ? teams[m*2+1] : {name:'IN MISSION...', players:'---'};

                    roundDiv.innerHTML += `
                        <div class="match" data-m="${mId}" data-n="${nId}">
                            <div class="team-slot">
                                <span class="display-team-name" id="${mId}_t0_name">${t0.name}</span>
                                <span class="display-players" id="${mId}_t0_players">${t0.players}</span>
                                <input type="number" class="score-input" id="${mId}_s0" value="0" oninput="checkWin('${mId}','${nId}')">
                            </div>
                            <div class="team-slot">
                                <span class="display-team-name" id="${mId}_t1_name">${t1.name}</span>
                                <span class="display-players" id="${mId}_t1_players">${t1.players}</span>
                                <input type="number" class="score-input" id="${mId}_s1" value="0" oninput="checkWin('${mId}','${nId}')">
                            </div>
                        </div>`;
                }
                bracket.appendChild(roundDiv);
            });
            bracket.innerHTML += `<div class="round"><div class="label">CHAMPION</div><div id="champ-box"><div id="champ">Warten...</div></div></div>`;
        }

        function checkWin(mId, nId) {
            const s0 = parseInt(document.getElementById(mId+'_s0').value) || 0;
            const s1 = parseInt(document.getElementById(mId+'_s1').value) || 0;

            if((s0 >= reqWins || s1 >= reqWins) && s0 !== s1) {
                const winIdx = s0 > s1 ? 0 : 1;
                const name = document.getElementById(`${mId}_t${winIdx}_name`).innerText;
                const players = document.getElementById(`${mId}_t${winIdx}_players`).innerText;

                if(name === "IN MISSION...") return;

                if(nId === 'champ') {
                    document.getElementById('champ').innerHTML = `<strong>${name}</strong><br><small>${players}</small>`;
                } else {
                    document.getElementById(nId+'_name').innerText = name;
                    document.getElementById(nId+'_players').innerText = players;
                }
            }
        }
        initSetup();
    </script>
</body>
</html>
