<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tactical Command | Round Robin</title>
    <style>
        :root { 
            --accent: #00ff41; --army: #4b5320; --bright: #a3b18a;
            --panel-bg: rgba(10, 15, 10, 0.98);
        }
        body {
            font-family: 'Courier New', monospace;
            background-color: #050a05;
            background-image:
                linear-gradient(rgba(0,255,65,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,65,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            padding-top: 90px;
            padding-bottom: 60px;
        }

        /* scanline overlay */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.07) 2px,
                rgba(0,0,0,0.07) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }
        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(10, 15, 10, 0.95); border-bottom: 1px solid var(--army);
            z-index: 9999; display: flex; justify-content: center; gap: 10px; padding: 12px 0;
        }
        .top-nav a {
            color: var(--accent); text-decoration: none; font-size: 0.75em;
            font-weight: bold; padding: 6px 12px; text-transform: uppercase; border: 1px solid transparent;
        }
        .top-nav a:hover { border: 1px solid var(--accent); background: rgba(0, 255, 65, 0.1); }
       
        .card { background: var(--panel-bg); padding: 30px; border: 2px solid var(--army); width: 95%; max-width: 1200px; box-shadow: 0 0 40px #000; margin-bottom: 50px; position: relative; z-index: 10; }
        h1 { text-align: center; letter-spacing: 5px; text-shadow: 0 0 10px var(--accent); }
        .setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin: 25px 0; }
        .team-input-box { border: 1px solid var(--army); padding: 15px; background: rgba(0,0,0,0.5); }
        input, select { background: #000; border: 1px solid var(--army); color: var(--accent); padding: 8px; width: 100%; box-sizing: border-box; margin-top: 5px; font-family: inherit; }
        button { background: var(--army); color: white; border: 1px solid var(--accent); padding: 12px 30px; cursor: pointer; text-transform: uppercase; font-weight: bold; margin-top: 20px; }
        
        /* Table Style */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(0,0,0,0.5); }
        th { background: var(--army); color: white; padding: 12px; text-transform: uppercase; letter-spacing: 2px; }
        td { border: 1px solid var(--army); padding: 10px; text-align: center; }
        .rank-1 { color: #fff; text-shadow: 0 0 10px var(--accent); font-weight: bold; }

        /* Match List */
        .match-list { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 40px; }
        .match-card { background: rgba(0,0,0,0.8); border: 1px solid var(--army); padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .score-input { width: 50px; background: var(--accent); color: #000; border: none; text-align: center; font-weight: bold; padding: 5px; margin: 0 10px; }
        
        .hidden { display: none; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <a href="../../index.html">[ MAIN ]</a>
        <a href="../../htmls/tbm.html">[ HUB ]</a>
        <a href="rbn1vs1.html" style="background: rgba(0,255,65,0.1); border-color: var(--neon-green);">[ 1VS1 ]</a>
        <a href="rbn2vs2.html">[ 2VS2 ]</a>
        <a href="rbn3vs3.html">[ 3VS3 ]</a>
        <a href="rbn5vs5.html">[ 5VS5 ]</a>
    </nav>

    <div class="card" id="step1">
        <h1 id="mode-title">ROUND ROBIN OPS</h1>
        <center>
            <div style="display:flex; justify-content:center; gap:30px;">
                <div>
                    <label>ANZAHL SQUADS:</label><br>
                    <select id="teamCount" onchange="initSetup()">
                        <option value="3">3 SQUADS</option>
                        <option value="4" selected>4 SQUADS</option>
                        <option value="5">5 SQUADS</option>
                        <option value="6">6 SQUADS</option>
                        <option value="8">8 SQUADS</option>
                    </select>
                </div>
                <div>
                    <label>BEST OF:</label><br>
                    <select id="boSelect">
                        <option value="1">Bo1</option>
                        <option value="2">Bo2 (Draw possible)</option>
                        <option value="3" selected>Bo3</option>
                        <option value="5">Bo5</option>
                    </select>
                </div>
            </div>
            <button onclick="startMission()">Operation Starten</button>
        </center>
        <div id="input-area" class="setup-grid"></div>
    </div>

    <div id="tournament-screen" class="card hidden">
        <h1>OPERATIONAL STANDINGS</h1>
        <table id="standings-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Squad</th>
                    <th>P</th>
                    <th>W</th>
                    <th>D</th>
                    <th>L</th>
                    <th>Score</th>
                    <th>Pts</th>
                </tr>
            </thead>
            <tbody id="standings-body"></tbody>
        </table>

        <h1 style="margin-top: 50px;">ENGAGEMENT LOG</h1>
        <div id="match-area" class="match-list"></div>

        <center><button onclick="location.reload()" style="background:#444; margin-top:40px;">Reset Operation</button></center>
    </div>

    <script>
        /* ==========================================
           KONFIGURATION FÜR DIE SPIELERANZAHL
           1 = 1vs1 | 2 = 2vs2 | 3 = 3vs3 | 5 = 5vs5
           ========================================== */
        const pPerTeam = 1; 
        /* ========================================== */

        let teams = [];
        let matches = [];
        let winsNeeded = 2;

        document.getElementById('mode-title').innerText = `ROUND ROBIN ${pPerTeam}VS${pPerTeam}`;

        function initSetup() {
            const count = parseInt(document.getElementById('teamCount').value);
            const area = document.getElementById('input-area');
            area.innerHTML = '';
            for(let i=0; i<count; i++) {
                let opInputs = '';
                for(let p=1; p<=pPerTeam; p++) opInputs += `<input type="text" id="t${i}_p${p}" value="Operator ${p}">`;
                area.innerHTML += `
                    <div class="team-input-box">
                        <strong>SQUAD ${i+1}</strong>
                        <input type="text" id="t${i}_n" value="Team ${i+1}">
                        ${opInputs}
                    </div>`;
            }
        }

        function startMission() {
            const count = parseInt(document.getElementById('teamCount').value);
            const bo = parseInt(document.getElementById('boSelect').value);
            
            // WinsNeeded Logik
            winsNeeded = (bo === 1) ? 1 : Math.ceil((bo + 1) / 2);
            if(bo === 2) winsNeeded = 2; // Spezialfall Bo2

            teams = [];
            for(let i=0; i<count; i++) {
                teams.push({ id: i, name: document.getElementById(`t${i}_n`).value, pts: 0, w: 0, d: 0, l: 0, plus: 0, minus: 0 });
            }

            // Matches generieren (Jeder gegen Jeden)
            matches = [];
            for(let i=0; i<count; i++) {
                for(let j=i+1; j<count; j++) {
                    matches.push({ t1: i, t2: j, s1: null, s2: null });
                }
            }

            renderTournament();
            
            // Hier passiert der Wechsel der Ansicht
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('tournament-screen').classList.remove('hidden');
        }

        function updateScore(mIdx, teamPos, val) {
            const num = val === '' ? null : parseInt(val);
            if(teamPos === 1) matches[mIdx].s1 = num;
            else matches[mIdx].s2 = num;
            updateLogic();
        }

        function updateLogic() {
            const bo = parseInt(document.getElementById('boSelect').value);
            // Werte zurücksetzen vor Neuberechnung
            teams.forEach(t => { t.pts=0; t.w=0; t.d=0; t.l=0; t.plus=0; t.minus=0; t.played=0; });

            matches.forEach(m => {
                if(m.s1 !== null && m.s2 !== null) {
                    const isFinished = (m.s1 >= winsNeeded || m.s2 >= winsNeeded || (bo === 2 && (m.s1 + m.s2 === 2)));

                    if(isFinished) {
                        teams[m.t1].played++; teams[m.t2].played++;
                        teams[m.t1].plus += m.s1; teams[m.t1].minus += m.s2;
                        teams[m.t2].plus += m.s2; teams[m.t2].minus += m.s1;

                        if(m.s1 > m.s2) { 
                            teams[m.t1].pts += 3; teams[m.t1].w++; teams[m.t2].l++; 
                        } else if(m.s2 > m.s1) { 
                            teams[m.t2].pts += 3; teams[m.t2].w++; teams[m.t1].l++; 
                        } else { 
                            teams[m.t1].pts += 1; teams[m.t2].pts += 1; teams[m.t1].d++; teams[m.t2].d++; 
                        }
                    }
                }
            });

            // Tabelle sortieren
            const sorted = [...teams].sort((a,b) => (b.pts - a.pts) || ((b.plus - b.minus) - (a.plus - a.minus)));
            const body = document.getElementById('standings-body');
            body.innerHTML = '';
            sorted.forEach((t, i) => {
                body.innerHTML += `
                    <tr class="${i === 0 && t.played > 0 ? 'rank-1' : ''}">
                        <td>${i+1}</td>
                        <td>${t.name}</td>
                        <td>${t.played}</td>
                        <td>${t.w}</td>
                        <td>${t.d}</td>
                        <td>${t.l}</td>
                        <td>${t.plus}:${t.minus}</td>
                        <td>${t.pts}</td>
                    </tr>`;
            });
        }

        function renderTournament() {
            const mArea = document.getElementById('match-area');
            mArea.innerHTML = '';
            matches.forEach((m, idx) => {
                mArea.innerHTML += `
                    <div class="match-card">
                        <span style="flex:1; text-align:right;">${teams[m.t1].name}</span>
                        <input type="number" class="score-input" placeholder="0" oninput="updateScore(${idx}, 1, this.value)">
                        :
                        <input type="number" class="score-input" placeholder="0" oninput="updateScore(${idx}, 2, this.value)">
                        <span style="flex:1;">${teams[m.t2].name}</span>
                    </div>`;
            });
            updateLogic();
        }

        initSetup();
    </script>
</body>
</html>
