<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Double Elimination 16 - Tactical Terminal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        h2.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
        
        :root {
            --g: #00c853; 
            --r: #e53935; 
            --dim: rgba(255,255,255,0.06); 
            --bdr: rgba(0, 255, 65, 0.2);
            --glow-g: rgba(0, 200, 83, 0.4);
            --accent: #00ff41;
            --bg-dark: #050a05;
        }

        /* HINTERGRUND-STIL */
        body {
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.05) 1px, transparent 1px);
            background-size: 30px 30px; /* Taktisches Grid-Muster */
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 15px; /* Erhöhte Grundschriftgröße für Lesbarkeit */
            overflow: hidden;
        }

        /* Scanline Overlay für den Terminal-Effekt */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
            pointer-events: none;
            z-index: 10000;
        }

        /* NAVIGATION - OPTIMIERT AUF GRÖSSE & LESBARKEIT */
        .top-nav { 
            position: fixed; top: 0; left: 0; width: 100%; 
            background: rgba(10, 20, 10, 0.95); 
            border-bottom: 2px solid var(--accent); 
            z-index: 1001; 
            display: flex; justify-content: center; gap: 20px; 
            padding: 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        
        .top-nav a { 
            color: var(--accent); 
            text-decoration: none; 
            font-size: 14px; 
            font-weight: 900; 
            padding: 10px 20px; 
            border: 1px solid var(--accent); 
            text-transform: uppercase;
            letter-spacing: 2px;
            background: rgba(0, 255, 65, 0.05);
            transition: all 0.3s ease;
        }
        
        .top-nav a:hover { 
            background: var(--accent); 
            color: #000; 
            box-shadow: 0 0 15px var(--accent); 
        }

        .header {
            position: fixed; top: 65px; width: 100%;
            background: rgba(13, 13, 13, 0.9); border-bottom: 1px solid var(--bdr);
            padding: 20px 30px; display: flex; align-items: center; gap: 35px; z-index: 100;
            backdrop-filter: blur(5px);
        }

        .header strong { 
            color: var(--g); font-size: 18px; 
            text-shadow: 0 0 12px var(--g); 
            letter-spacing: 1px;
        }

        .bo-ctrl { display: flex; align-items: center; gap: 12px; color: #aaa; font-weight: bold; }
        .bo-ctrl input { 
            width: 50px; background: #000; border: 1px solid var(--accent); 
            color: var(--accent); text-align: center; padding: 6px; 
            font-size: 16px; font-weight: bold;
        }

        .outer { overflow: auto; width: 100%; height: 100vh; padding-top: 150px; }
        .canvas { position: relative; width: 3400px; padding: 100px 60px; }
        
        svg#lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 0 5px var(--glow-g)); }
        
        .layout { display: flex; align-items: flex-start; gap: 15px; height: 1800px; }
        .col { display: flex; flex-direction: column; justify-content: space-around; width: 260px; flex-shrink: 0; height: 100%; position: relative; z-index: 10; }
        
        .col-label { 
            position: absolute; top: -50px; left: 50%; transform: translateX(-50%); 
            font-size: 14px; color: var(--accent); text-shadow: 0 0 10px var(--accent);
            letter-spacing: 3px; text-transform: uppercase; font-weight: bold;
        }

        /* MATCH BOXEN - BREITER & KLARER */
        .match { 
            background: rgba(10, 10, 10, 0.9); border: 1px solid var(--bdr); 
            width: 240px; border-radius: 4px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        
        .match.has-winner { border-color: var(--accent); box-shadow: 0 0 20px var(--glow-g); }
        .match-label { position: absolute; top: -22px; left: 0; font-size: 11px; color: #666; font-weight: bold; }

        .unit { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; min-height: 55px; }
        .unit + .unit { border-top: 1px solid rgba(0, 255, 65, 0.1); }

        .uname { font-size: 15px; color: #eee; font-weight: 600; text-shadow: 1px 1px 2px #000; }
        
        .uname-input {
            background: rgba(0, 255, 65, 0.05); border: 1px solid #333;
            color: #fff; font-family: inherit; font-size: 14px; width: 150px; 
            outline: none; padding: 5px; border-radius: 2px;
        }
        .uname-input:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--glow-g); }

        .score-input {
            width: 42px; background: #000; border: 1px solid #444;
            color: var(--accent); text-align: center; font-size: 16px;
            font-weight: bold; padding: 4px;
        }

        .unit.winner .uname { color: var(--accent); text-shadow: 0 0 10px var(--accent); }
        .unit.loser .uname { color: #555; text-decoration: line-through; opacity: 0.6; }

        /* CHAMPION ANZEIGE */
        .champion { 
            background: linear-gradient(135deg, #0a1f0a, #000); 
            border: 3px solid var(--accent); padding: 30px 20px; 
            box-shadow: 0 0 40px var(--glow-g);
            margin-top: 20px;
        }
        .champ-title { font-size: 12px; color: var(--accent); letter-spacing: 4px; margin-bottom: 10px; opacity: 0.8; }
        .champ-name { font-size: 22px; color: #fff; font-weight: 900; text-shadow: 0 0 20px var(--accent); }

        .reset-btn {
            margin-left: auto; background: transparent; border: 1px solid var(--r);
            color: var(--r); font-size: 12px; padding: 8px 18px; cursor: pointer;
            font-weight: bold; transition: all 0.3s;
        }
        .reset-btn:hover { background: var(--r); color: #fff; box-shadow: 0 0 15px var(--r); }
    </style>
</head>
<body>

<nav class="top-nav">
    <a href="../../index.html">[ MAIN ]</a>
    <a href="../../htmls/tbm.html">[ HUB ]</a>
    <a href="#">[ 16ner SYSTEM ]</a>  
</nav>

<div class="header">
    <strong>⬡ DOUBLE ELIMINATION · CORE 16</strong>
    <div class="bo-ctrl">BEST OF: <input type="number" id="bo" value="2" min="1" max="5"></div>
    <button class="reset-btn" onclick="resetAll()">SYSTEM RESET</button>
</div>

<div class="outer">
    <div class="canvas" id="canvas">
        <svg id="lines"></svg>
        <div class="layout">
            <div class="col" id="col-start"><span class="col-label">Round 1</span></div>
            <div class="col" id="col-wb1"><span class="col-label">WB R2</span></div>
            <div class="col" id="col-wb2"><span class="col-label">WB Semi</span></div>
            <div class="col" id="col-wb3"><span class="col-label">WB Final</span></div>
            <div class="col" id="col-grand" style="width:240px"><span class="col-label">Grand Final</span></div>
            <div class="col" id="col-lb1"><span class="col-label">LB R1</span></div>
            <div class="col" id="col-lb2"><span class="col-label">LB R2</span></div>
            <div class="col" id="col-lb3"><span class="col-label">LB R3</span></div>
            <div class="col" id="col-lb4"><span class="col-label">LB R4</span></div>
            <div class="col" id="col-lb5"><span class="col-label">LB Final</span></div>
        </div>
    </div>
</div>

<script>
// Logik bleibt identisch zur double_elimination_16_2.html für volle Funktionalität
let bo = 2;
const names = Array.from({length:16},(_,i)=>`Unit ${String(i+1).padStart(2,'0')}`);

const matchDefs = [
    {id:'r1m1',col:'col-start',label:'R1 M1'},{id:'r1m2',col:'col-start',label:'R1 M2'},
    {id:'r1m3',col:'col-start',label:'R1 M3'},{id:'r1m4',col:'col-start',label:'R1 M4'},
    {id:'r1m5',col:'col-start',label:'R1 M5'},{id:'r1m6',col:'col-start',label:'R1 M6'},
    {id:'r1m7',col:'col-start',label:'R1 M7'},{id:'r1m8',col:'col-start',label:'R1 M8'},
    {id:'wb2m1',col:'col-wb1',label:'WB R2 M1'},{id:'wb2m2',col:'col-wb1',label:'WB R2 M2'},
    {id:'wb2m3',col:'col-wb1',label:'WB R2 M3'},{id:'wb2m4',col:'col-wb1',label:'WB R2 M4'},
    {id:'wb3m1',col:'col-wb2',label:'WB Semi M1'},{id:'wb3m2',col:'col-wb2',label:'WB Semi M2'},
    {id:'wbfinal',col:'col-wb3',label:'WB Final'},
    {id:'lb1m1',col:'col-lb1',label:'LB R1 M1'},{id:'lb1m2',col:'col-lb1',label:'LB R1 M2'},
    {id:'lb1m3',col:'col-lb1',label:'LB R1 M3'},{id:'lb1m4',col:'col-lb1',label:'LB R1 M4'},
    {id:'lb2m1',col:'col-lb2',label:'LB R2 M1'},{id:'lb2m2',col:'col-lb2',label:'LB R2 M2'},
    {id:'lb2m3',col:'col-lb2',label:'LB R2 M3'},{id:'lb2m4',col:'col-lb2',label:'LB R2 M4'},
    {id:'lb3m1',col:'col-lb3',label:'LB R3 M1'},{id:'lb3m2',col:'col-lb3',label:'LB R3 M2'},
    {id:'lb4m1',col:'col-lb4',label:'LB R4 M1'},{id:'lb4m2',col:'col-lb4',label:'LB R4 M2'},
    {id:'lbfinal',col:'col-lb5',label:'LB Final'},
];

const routing = {
    'r1m1':{w:'wb2m1:0',l:'lb1m1:0'}, 'r1m2':{w:'wb2m1:1',l:'lb1m1:1'},
    'r1m3':{w:'wb2m2:0',l:'lb1m2:0'}, 'r1m4':{w:'wb2m2:1',l:'lb1m2:1'},
    'r1m5':{w:'wb2m3:0',l:'lb1m3:0'}, 'r1m6':{w:'wb2m3:1',l:'lb1m3:1'},
    'r1m7':{w:'wb2m4:0',l:'lb1m4:0'}, 'r1m8':{w:'wb2m4:1',l:'lb1m4:1'},
    'wb2m1':{w:'wb3m1:0',l:'lb2m1:1'}, 'wb2m2':{w:'wb3m1:1',l:'lb2m2:1'},
    'wb2m3':{w:'wb3m2:0',l:'lb2m3:1'}, 'wb2m4':{w:'wb3m2:1',l:'lb2m4:1'},
    'wb3m1':{w:'wbfinal:0',l:'lb3m1:1'}, 'wb3m2':{w:'wbfinal:1',l:'lb3m2:1'},
    'wbfinal':{w:'grand:0',l:'lb4m1:0'},
    'lb1m1':{w:'lb2m1:0',l:'KIA'}, 'lb1m2':{w:'lb2m2:0',l:'KIA'},
    'lb1m3':{w:'lb2m3:0',l:'KIA'}, 'lb1m4':{w:'lb2m4:0',l:'KIA'},
    'lb2m1':{w:'lb3m1:0',l:'KIA'}, 'lb2m2':{w:'lb3m2:0',l:'KIA'},
    'lb2m3':{w:'lb4m1:1',l:'KIA'}, 'lb2m4':{w:'lb4m2:1',l:'KIA'},
    'lb3m1':{w:'lb4m1:0',l:'KIA'}, 'lb3m2':{w:'lb4m2:0',l:'KIA'},
    'lb4m1':{w:'lbfinal:0',l:'KIA'}, 'lb4m2':{w:'lbfinal:1',l:'KIA'},
    'lbfinal':{w:'grand:1',l:'KIA'},
};

const state = {};

function initState(){
    matchDefs.forEach(m => { state[m.id] = { names:['',''], scores:[0,0] } });
    state['grand'] = { names:['',''], scores:[0,0] };
    for(let i=0; i<8; i++){
        state[`r1m${i+1}`].names = [names[i*2], names[i*2+1]];
    }
}

function buildDOM(){
    matchDefs.forEach(m => {
        const col = document.getElementById(m.col);
        const isStart = m.col === 'col-start';
        const div = document.createElement('div');
        div.className = 'match'; div.id = 'match-' + m.id;
        div.innerHTML = `
            <div class="match-label">${m.label}</div>
            <div class="unit" id="u-${m.id}-0">
                ${isStart ? `<input type="text" class="uname-input" id="in-${m.id}-0" value="${state[m.id].names[0]}" oninput="updateName('${m.id}', 0)">` : `<span class="uname" id="name-${m.id}-0">–</span>`}
                <input type="number" class="score-input" id="sc-${m.id}-0" min="0" oninput="onScore('${m.id}')">
            </div>
            <div class="unit" id="u-${m.id}-1">
                ${isStart ? `<input type="text" class="uname-input" id="in-${m.id}-1" value="${state[m.id].names[1]}" oninput="updateName('${m.id}', 1)">` : `<span class="uname" id="name-${m.id}-1">–</span>`}
                <input type="number" class="score-input" id="sc-${m.id}-1" min="0" oninput="onScore('${m.id}')">
            </div>`;
        col.appendChild(div);
    });

    const gf = document.getElementById('col-grand');
    gf.innerHTML = `
        <div style="display:flex; flex-direction:column; gap:40px; align-items:center;">
            <div class="match" id="match-grand">
                <div class="match-label">Grand Final</div>
                <div class="unit" id="u-grand-0"><span class="uname" id="name-grand-0">–</span><input type="number" class="score-input" id="sc-grand-0" min="0" oninput="onScore('grand')"></div>
                <div class="unit" id="u-grand-1"><span class="uname" id="name-grand-1">–</span><input type="number" class="score-input" id="sc-grand-1" min="0" oninput="onScore('grand')"></div>
            </div>
            <div class="match champion">
                <div class="champ-title">SUPREME CHAMPION</div>
                <div class="champ-name" id="champ-name">INITIALIZING...</div>
            </div>
        </div>`;
}

function updateName(id, slot) {
    state[id].names[slot] = document.getElementById(`in-${id}-${slot}`).value;
    onScore(id);
}

function renderAll(){
    [...matchDefs.map(m=>m.id), 'grand'].forEach(id => {
        const s = state[id];
        const matchEl = document.getElementById('match-'+id);
        let hasWinner = false;

        for(let i=0; i<2; i++){
            const nameEl = document.getElementById(`name-${id}-${i}`);
            if(nameEl) {
                nameEl.textContent = s.names[i] || '–';
                nameEl.className = s.names[i] ? 'uname' : 'uname empty';
            }
            document.getElementById(`u-${id}-${i}`).className = 'unit';
        }

        const s0 = s.scores[0], s1 = s.scores[1];
        if((s0 >= bo || s1 >= bo) && s0 !== s1){
            const winIdx = s0 > s1 ? 0 : 1;
            document.getElementById(`u-${id}-${winIdx}`).classList.add('winner');
            document.getElementById(`u-${id}-${1-winIdx}`).classList.add('loser');
            hasWinner = true;
        }
        if(matchEl) matchEl.classList.toggle('has-winner', hasWinner);
    });

    const gs = state['grand'];
    if((gs.scores[0] >= bo || gs.scores[1] >= bo) && gs.scores[0] !== gs.scores[1]){
        document.getElementById('champ-name').textContent = gs.scores[0] > gs.scores[1] ? gs.names[0] : gs.names[1];
    } else {
        document.getElementById('champ-name').textContent = '–';
    }
}

function onScore(id){
    const s = state[id];
    s.scores[0] = parseInt(document.getElementById(`sc-${id}-0`).value) || 0;
    s.scores[1] = parseInt(document.getElementById(`sc-${id}-1`).value) || 0;

    if((s.scores[0] >= bo || s.scores[1] >= bo) && s.scores[0] !== s.scores[1]){
        const wi = s.scores[0] > s.scores[1] ? 0 : 1;
        const r = routing[id];
        if(r) {
            place(r.w, s.names[wi]);
            if(r.l !== 'KIA') place(r.l, s.names[1-wi]);
        }
    }
    renderAll();
}

function place(target, name){
    if(!target || target === 'KIA') return;
    const [mid, slot] = target.split(':');
    state[mid].names[parseInt(slot)] = name;
}

function drawLines(){
    const svg = document.getElementById('lines');
    svg.innerHTML = '<defs><marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 2L8 5L2 8" fill="none" stroke="#00c853" stroke-width="2"/></marker></defs>';
    const canvasR = document.getElementById('canvas').getBoundingClientRect();

    const getPos = (id, isGF = false) => {
        const el = document.getElementById(isGF ? 'match-grand' : 'match-'+id);
        if(!el) return null;
        const r = el.getBoundingClientRect();
        return { 
            right: r.right - canvasR.left, 
            left: r.left - canvasR.left, 
            mid: (r.top + r.height/2) - canvasR.top,
            top: r.top - canvasR.top
        };
    };

    Object.entries(routing).forEach(([fid, r]) => {
        const f = getPos(fid); if(!f) return;
        [r.w, r.l].forEach((target, i) => {
            if(!target || target === 'KIA') return;
            const [tid, slot] = target.split(':');
            const t = getPos(tid, tid==='grand'); if(!t) return;
            
            const ty = t.top + 28 + (parseInt(slot) * 55);
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const mx = f.right + 20;
            path.setAttribute('d', `M${f.right},${f.mid} L${mx},${f.mid} L${mx},${ty} L${t.left},${ty}`);
            path.setAttribute('stroke', i === 0 ? '#00c853' : '#e53935');
            path.setAttribute('fill', 'none');
            path.setAttribute('stroke-width', '2');
            path.setAttribute('stroke-dasharray', i === 0 ? '' : '5 4');
            path.setAttribute('marker-end', 'url(#aw)');
            svg.appendChild(path);
        });
    });
}

function resetAll(){
    if(confirm("SYSTEM REBOOT? Alle Daten werden gelöscht.")) location.reload();
}

document.getElementById('bo').onchange = (e) => { bo = parseInt(e.target.value) || 2; renderAll(); };

initState();
buildDOM();
renderAll();
setTimeout(() => { drawLines(); new ResizeObserver(drawLines).observe(document.getElementById('canvas')); }, 500);
</script>
</body>
</html>
