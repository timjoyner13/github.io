<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tactical Command Hub</title>
    <style>
        :root { 
            --accent: #00ff41; 
            --army: #4b5320; 
            --glow: rgba(0, 255, 65, 0.4);
        }

        body { 
            font-family: 'Courier New', monospace; 
            background-color: #ffffff;
            background-image: url('DEIN_HINTERGRUND.gif'); 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center;
            color: var(--accent); 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
            overflow: hidden;
        }

        /* Scanlines & Abdunklung */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; z-index: 1; pointer-events: none;
        }

        .top-nav {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(10, 15, 10, 0.95); border-bottom: 1px solid var(--army);
            z-index: 9999; display: flex; justify-content: center; gap: 10px; padding: 12px 0;
        }
        .top-nav a {
            color: var(--accent); text-decoration: none; font-size: 0.75em;
            font-weight: bold; padding: 6px 12px; text-transform: uppercase; border: 1px solid transparent;
        }
        .top-nav a:hover { border: 1px solid var(--accent); background: rgba(0, 255, 65, 0.1); }

        .container {
            position: relative; z-index: 10; text-align: center;
            padding: 40px; border: 2px solid var(--army);
            background: rgba(10, 15, 10, 0.9);
            box-shadow: 0 0 30px rgba(0,0,0,1);
            max-width: 650px; width: 90%;
        }

        h1 {
            font-size: 2.2em; letter-spacing: 5px; margin-bottom: 5px;
            text-shadow: 0 0 10px var(--accent);
        }

        /* Motto Styling */
        .motto {
            font-size: 0.9em;
            letter-spacing: 3px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 25px;
            opacity: 0.8;
            border-bottom: 2px solid var(--army);
            padding-bottom: 15px;
            display: block;
        }

        .main-menu {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }

        .nav-link {
            text-decoration: none; color: var(--accent);
            padding: 18px; border: 1px solid var(--army);
            font-weight: bold; text-transform: uppercase;
            transition: all 0.3s ease;
            font-size: 0.9em;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .nav-link small { font-size: 0.6em; color: var(--army); margin-top: 5px; }

        .nav-link:hover {
            background: var(--army); color: #fff;
            box-shadow: 0 0 15px var(--glow);
            transform: scale(1.03); border-color: var(--accent);
        }

        .status-bar { margin-top: 25px; font-size: 0.75em; color: var(--army); letter-spacing: 2px; }
        .blink { animation: blinker 1.5s linear infinite; color: var(--accent); }
        @keyframes blinker { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="overlay"></div>

    <nav class="top-nav">
        <a href="htmls/community.html">[ PEPE BATTALION ]</a>
        
    </nav>

    <div class="container">
        <h1>TOURNAMENT HUB</h1>
        <span class="motto">Silent. Precise. Green.</span>
        
        <div class="status-bar"><span class="blink">●</span> ENCRYPTION ACTIVE // SELECT MISSION</div>
        <br>
        
        <div class="main-menu">
            <a href="htmls/1vs1.html" class="nav-link">1vs1 DUEL <small>Single Ops</small></a>
            <a href="htmls/2vs2.html" class="nav-link">2vs2 SQUAD <small>Tactical Pair</small></a>
            <a href="htmls/3vs3.html" class="nav-link">3vs3 PLATOON <small>Fireteam</small></a>
            <a href="htmls/5vs5.html" class="nav-link">5vs5 WARFARE <small>Full Scale</small></a>
        </div>
        
        <div style="margin-top: 35px; font-size: 0.55em; opacity: 0.4; letter-spacing: 1px;">
            TERMINAL v4.5 - SECURE DATA LINK
        </div>
    </div>

</body>
</html>
